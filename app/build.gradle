plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.steal.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.steal.voiceassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Le modèle Vosk (dossier assets/vosk-model-small-fr) peut peser plusieurs
    // dizaines de Mo : on désactive la compression pour cet asset.
    aaptOptions {
        noCompress "tflite"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Reconnaissance vocale 100% offline
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // Coroutines pour le service d'écoute en tâche de fond
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
